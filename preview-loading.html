<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouttbuk — Animación de Libreta Realista con Anime.js y Anillado 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&display=swap" rel="stylesheet">
  <!-- Anime.js v4 UMD -->
  <script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --teal: #14b8a6;
      --teal-glow: rgba(20, 184, 166, 0.4);
      --page-bg: #f8fafc;
      --page-line: #e2e8f0;
      --hole-color: rgba(15, 23, 42, 0.85);
      --wire-color: #ffffff;
      --wire-shadow: rgba(15, 23, 42, 0.45);
      --border: #334155;
      --bar-bg: rgba(255, 255, 255, 0.08);
      --font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --scale-factor: 1.5; /* Escala protagónica (~170px) */
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --teal: #0d9488;
      --teal-glow: rgba(20, 184, 166, 0.25);
      --page-bg: #ffffff;
      --page-line: #f1f5f9;
      --hole-color: rgba(15, 23, 42, 0.7);
      --border: #e2e8f0;
      --bar-bg: rgba(15, 23, 42, 0.06);
    }

    [data-theme="atelier"] {
      --bg: #1c1712;
      --card-bg: #251f18;
      --text: #f2ece0;
      --text-muted: #ab9c86;
      --primary: #caa15a;
      --primary-dark: #8c6b30;
      --teal: #caa15a;
      --teal-glow: rgba(202, 161, 90, 0.35);
      --page-bg: #fdfbf7;
      --page-line: #ece7db;
      --hole-color: rgba(28, 23, 18, 0.85);
      --border: #3c3327;
      --bar-bg: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background-color 0.4s ease, color 0.4s ease;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glow */
    .ambient-glow {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 580px;
      height: 580px;
      background: radial-gradient(circle, var(--teal-glow) 0%, transparent 68%);
      opacity: 0.5;
      filter: blur(60px);
      pointer-events: none;
      transition: all 0.5s ease;
      animation: ambient-pulse 4.5s ease-in-out infinite alternate;
    }

    @keyframes ambient-pulse {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.35; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.65; }
    }

    /* Main Container */
    .loader-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      user-select: none;
    }

    /* Book Stage */
    .book-scene {
      width: calc(220px * var(--scale-factor));
      height: calc(165px * var(--scale-factor));
      perspective: 1500px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: gentle-levitation 4s ease-in-out infinite alternate;
    }

    @keyframes gentle-levitation {
      0% { transform: translateY(0px) rotate(-0.5deg); }
      100% { transform: translateY(-8px) rotate(0.8deg); }
    }

    /* Isometric Rig */
    .book-rig {
      width: 160px;
      height: 120px;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(54deg) rotateZ(-36deg);
    }

    /* Base Teal Accent Layer (Nouttbuk signature offset) */
    .book-teal-base {
      position: absolute;
      width: 164px;
      height: 124px;
      left: 8px;
      top: 8px;
      border-radius: 16px;
      background: var(--teal);
      opacity: 0.95;
      box-shadow: 0 0 28px var(--teal-glow), 0 20px 40px rgba(15, 23, 42, 0.45);
      transform: translateZ(-20px);
      transition: background 0.3s;
    }

    /* Solid Back Cover */
    .book-back-cover {
      position: absolute;
      width: 160px;
      height: 120px;
      border-radius: 14px;
      background: var(--primary-dark);
      transform: translateZ(-16px);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.35);
    }

    /* Left static page stack - Oculto permanentemente para evitar que aparezca una hoja debajo de la carátula */
    .page-stack-left {
      display: none !important;
    }

    /* Right static page stack */
    .page-stack-right {
      position: absolute;
      left: 16px;
      top: 5px;
      width: 135px;
      height: 110px;
      background: var(--page-bg);
      border-radius: 0 10px 10px 0;
      transform: translateZ(-10px);
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.14);
      overflow: hidden;
    }

    /* Faint ruling lines for student notes */
    .page-ruled-lines,
    .paper-ruled-lines {
      width: 100%;
      height: 100%;
      padding: 12px 14px 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    /* Soft margin line for authentic university notebook feel */
    .page-ruled-lines::before,
    .paper-ruled-lines::before {
      content: '';
      position: absolute;
      left: 24px;
      top: 0;
      bottom: 0;
      width: 1.5px;
      background: rgba(20, 184, 166, 0.28);
      pointer-events: none;
    }

    .paper-backface .page-ruled-lines::before,
    .page-stack-left .page-ruled-lines::before {
      left: auto;
      right: 24px;
    }

    .p-line {
      height: 2px;
      background: var(--page-line);
      border-radius: 2px;
      width: 100%;
    }
    .p-line.w-short { width: 52%; }
    .p-line.w-mid { width: 75%; }
    .p-line.accent {
      background: linear-gradient(90deg, var(--teal), var(--page-line));
      opacity: 0.85;
    }

    /* Moving Dynamic Under-page Shadows */
    .under-page-shadow-right {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0, 0, 0, 0.25) 0%, transparent 65%);
      opacity: 0;
      pointer-events: none;
    }

    .under-page-shadow-left {
      position: absolute;
      inset: 0;
      background: linear-gradient(-90deg, rgba(0, 0, 0, 0.25) 0%, transparent 65%);
      opacity: 0;
      pointer-events: none;
    }

    /* Anime.js Articulated Flipping Leaf */
    .paper-leaf {
      position: absolute;
      left: 16px;
      top: 5px;
      width: 135px;
      height: 110px;
      transform-origin: left center;
      transform-style: preserve-3d;
      pointer-events: none;
      z-index: 20;
    }

    /* The flexible curved paper surface */
    .paper-body {
      width: 100%;
      height: 100%;
      background: var(--page-bg);
      border-radius: 0 10px 10px 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      position: relative;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Dynamic Paper Curvature Shadow */
    .paper-curl-shadow {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(15, 23, 42, 0.12) 28%, rgba(255, 255, 255, 0.45) 50%, rgba(15, 23, 42, 0.16) 72%, transparent 100%);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* Backface of turning paper */
    .paper-backface {
      position: absolute;
      inset: 0;
      background: var(--page-bg);
      border-radius: 10px 0 0 10px;
      transform: rotateY(180deg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      box-shadow: -2px 0 10px rgba(0, 0, 0, 0.12);
    }

    /* Front Cover with "tt" cutout - Sits on top of pages when closed (Z: 8px) */
    .book-front-cover {
      position: absolute;
      left: 14px;
      top: 0;
      width: 142px;
      height: 120px;
      background: var(--primary);
      border-radius: 0 14px 14px 0;
      transform-origin: 2px center;
      transform-style: preserve-3d;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
      z-index: 40;
      transform: translateZ(8px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover-backface {
      position: absolute;
      inset: 0;
      background: var(--primary-dark);
      border-radius: 14px 0 0 14px;
      transform: rotateY(180deg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .cover-frontface {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 0 14px 14px 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* --- ANILLADO REALISTA DE CUADERNO (Authentic Wire-O Binding) --- */

    /* 3D Binder Spine Container (Anillado Metálico Realista de Cuaderno) */
    .binder-spine-3d {
      position: absolute;
      left: 3px;
      top: 2px;
      width: 26px;
      height: 116px;
      transform-style: preserve-3d;
      transform: translateZ(14px);
      z-index: 100;
      pointer-events: none;
    }

    .binder-spine-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .wire-arch-path {
      transition: stroke 0.25s ease, filter 0.25s ease;
    }

    .wire-ring-group {
      transform-origin: center;
      transition: transform 0.2s ease;
    }

    .punch-hole-left {
      transition: opacity 0.3s ease;
    }

    /* Swiss Progress Bar */
    .progress-bar-container {
      width: 230px;
      height: 3px;
      background: var(--bar-bg);
      border-radius: 9999px;
      margin-top: 16px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 45%;
      border-radius: 9999px;
      background: linear-gradient(90deg, transparent, var(--primary), var(--teal), transparent);
      animation: progress-slide 2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes progress-slide {
      0% { left: -50%; width: 30%; }
      50% { width: 60%; }
      100% { left: 120%; width: 30%; }
    }

    /* Message Rotator */
    .message-container {
      margin-top: 20px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .status-text {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--text);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      white-space: nowrap;
    }

    .status-text.active {
      opacity: 1;
      transform: translateY(0);
    }

    .sub-brand {
      margin-top: 22px;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0.6;
    }

    /* Toolbar for Testing */
    .toolbar-container {
      position: fixed;
      bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 50;
    }

    .theme-toolbar {
      display: flex;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
    }

    .control-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .control-btn:hover {
      color: var(--text);
    }

    .control-btn.active {
      background: var(--primary);
      color: #ffffff;
    }
  </style>
</head>

              <rect class="punch-hole-right" x="19.5" y="42.5" width="4.5" height="7" rx="2.2" fill="#090d16" />
              <path class="wire-shadow-path" d="M 4.25 44 C 7 39.5, 19 41, 21.75 46" stroke="rgba(15,23,42,0.4)" stroke-width="3" stroke-linecap="round" fill="none" />
              <path class="wire-arch-path" d="M 4.25 44 C 7 38.8, 19 40.3, 21.75 45.5" stroke="url(#wireCylinder)" stroke-width="2.8" stroke-linecap="round" fill="none" filter="url(#ringShadow)" />
              <path class="wire-gleam-path" d="M 5 43 C 7.5 39.2, 17.5 40.5, 20.5 44.5" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.9" fill="none" />
            </g>

            <!-- Ring 3 (y = 62) -->
            <g class="wire-ring-group" id="ring-3">
              <rect class="punch-hole-left" x="2" y="59" width="4.5" height="7" rx="2.2" fill="#090d16" opacity="0" />
              <rect class="punch-hole-right" x="19.5" y="60.5" width="4.5" height="7" rx="2.2" fill="#090d16" />
              <path class="wire-shadow-path" d="M 4.25 62 C 7 57.5, 19 59, 21.75 64" stroke="rgba(15,23,42,0.4)" stroke-width="3" stroke-linecap="round" fill="none" />
              <path class="wire-arch-path" d="M 4.25 62 C 7 56.8, 19 58.3, 21.75 63.5" stroke="url(#wireCylinder)" stroke-width="2.8" stroke-linecap="round" fill="none" filter="url(#ringShadow)" />
              <path class="wire-gleam-path" d="M 5 61 C 7.5 57.2, 17.5 58.5, 20.5 62.5" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.9" fill="none" />
            </g>

            <!-- Ring 4 (y = 80) -->
            <g class="wire-ring-group" id="ring-4">
              <rect class="punch-hole-left" x="2" y="77" width="4.5" height="7" rx="2.2" fill="#090d16" opacity="0" />
              <rect class="punch-hole-right" x="19.5" y="78.5" width="4.5" height="7" rx="2.2" fill="#090d16" />
              <path class="wire-shadow-path" d="M 4.25 80 C 7 75.5, 19 77, 21.75 82" stroke="rgba(15,23,42,0.4)" stroke-width="3" stroke-linecap="round" fill="none" />
              <path class="wire-arch-path" d="M 4.25 80 C 7 74.8, 19 76.3, 21.75 81.5" stroke="url(#wireCylinder)" stroke-width="2.8" stroke-linecap="round" fill="none" filter="url(#ringShadow)" />
              <path class="wire-gleam-path" d="M 5 79 C 7.5 75.2, 17.5 76.5, 20.5 80.5" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.9" fill="none" />
            </g>

            <!-- Ring 5 (y = 98) -->
            <g class="wire-ring-group" id="ring-5">
              <rect class="punch-hole-left" x="2" y="95" width="4.5" height="7" rx="2.2" fill="#090d16" opacity="0" />
              <rect class="punch-hole-right" x="19.5" y="96.5" width="4.5" height="7" rx="2.2" fill="#090d16" />
              <path class="wire-shadow-path" d="M 4.25 98 C 7 93.5, 19 95, 21.75 100" stroke="rgba(15,23,42,0.4)" stroke-width="3" stroke-linecap="round" fill="none" />
              <path class="wire-arch-path" d="M 4.25 98 C 7 92.8, 19 94.3, 21.75 99.5" stroke="url(#wireCylinder)" stroke-width="2.8" stroke-linecap="round" fill="none" filter="url(#ringShadow)" />
              <path class="wire-gleam-path" d="M 5 97 C 7.5 93.2, 17.5 94.5, 20.5 98.5" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.9" fill="none" />
            </g>
          </svg>
        </div>
      </div>
    </div>

    <!-- Swiss Progress Bar -->
    <div class="progress-bar-container">
      <div class="progress-bar-indicator"></div>
    </div>

    <!-- Micro-Message Rotator -->
    <div class="message-container">
      <div class="status-text active" id="status-text">Organizando tus apuntes...</div>
    </div>

    <div class="sub-brand">Tus apuntes, tu comunidad</div>
  </div>

  <!-- Testing Controls Toolbar -->
  <div class="toolbar-container">
    <div class="theme-toolbar">
      <button class="control-btn active" onclick="setTheme('dark')">Modo Oscuro</button>
      <button class="control-btn" onclick="setTheme('light')">Modo Claro</button>
      <button class="control-btn" onclick="setTheme('atelier')">Atelier (Editor)</button>
    </div>

    <div class="theme-toolbar">
      <span style="font-size: 0.7rem; font-weight: 700; color: var(--text-muted); align-self: center; margin-right: 4px;">ESCALA:</span>
      <button class="control-btn" onclick="setScale(1.0)">Mediano (1x)</button>
      <button class="control-btn active" onclick="setScale(1.5)">Grande (1.5x)</button>
      <button class="control-btn" onclick="setScale(1.85)">XL (1.85x)</button>
    </div>

    <div class="theme-toolbar">
      <span style="font-size: 0.7rem; font-weight: 700; color: var(--text-muted); align-self: center; margin-right: 4px;">MODO:</span>
      <button class="control-btn active" id="btn-mode-cycle" onclick="setAnimationMode('cycle')">Ciclo Completo</button>
      <button class="control-btn" id="btn-mode-infinite" onclick="setAnimationMode('infinite')">Hojeo Continuo</button>
    </div>
  </div>

  <script>
    // --- Message Rotator ---
    const messages = [
      "Organizando tus apuntes...",
      "Pasando a la siguiente página...",
      "Sincronizando con tu ciclo...",
      "Preparando tu espacio de estudio...",
      "Conectando con la comunidad...",
      "Afilando ideas..."
    ];

    let currentMsgIdx = 0;
    const textEl = document.getElementById("status-text");

    setInterval(() => {
      textEl.classList.remove("active");
      setTimeout(() => {
        currentMsgIdx = (currentMsgIdx + 1) % messages.length;
        textEl.textContent = messages[currentMsgIdx];
        textEl.classList.add("active");
      }, 350);
    }, 2800);

    function setTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      document.querySelectorAll('.control-btn').forEach(btn => {
        if (['Modo Oscuro', 'Modo Claro', 'Atelier (Editor)'].includes(btn.textContent)) {
          btn.classList.remove('active');
        }
      });
      event.target.classList.add('active');
    }

    function setScale(scale) {
      document.documentElement.style.setProperty('--scale-factor', scale);
      document.querySelectorAll('.control-btn').forEach(btn => {
        if (btn.textContent.includes('x')) {
          btn.classList.remove('active');
        }
      });
      event.target.classList.add('active');
    }

    let currentTimeline = null;
    let currentMode = 'cycle';

    function setAnimationMode(mode) {
      if (currentMode === mode && currentTimeline) return;
      currentMode = mode;

      document.getElementById('btn-mode-cycle').classList.toggle('active', mode === 'cycle');
      document.getElementById('btn-mode-infinite').classList.toggle('active', mode === 'infinite');

      if (mode === 'cycle') {
        buildCycleTimeline();
      } else {
        buildInfiniteTimeline();
      }
    }

    // --- Ciclo Completo (Apertura con Portada Liderando -> Hojas Acompañando en Cascada -> Reposo Completo) ---
    function buildCycleTimeline() {
      if (currentTimeline) {
        currentTimeline.cancel();
      }

      const { createTimeline, stagger, set } = anime;

      // 1. ESTADO INICIAL ESTRICTO:
      // La portada está en la cima (Z=8, z-index=40).
      // Las hojas están debajo de la portada (Z=6, 4, 2, z-index=33, 32, 31).
      // Las anillas metálicas reales del lomo están elevadas (Z=14, z-index=100) y visibles en todo momento.
      set('#front-cover', { rotateY: 0, translateZ: 8, opacity: 1 });
      set('#leaf-1', { rotateY: 0, translateZ: 6, opacity: 1 });
      set('#leaf-2', { rotateY: 0, translateZ: 4, opacity: 1 });
      set('#leaf-3', { rotateY: 0, translateZ: 2, opacity: 1 });
      set(['#leaf-body-1', '#leaf-body-2', '#leaf-body-3'], { rotateY: 0, rotateZ: 0 });
      set(['#curl-shadow-1', '#curl-shadow-2', '#curl-shadow-3'], { opacity: 0 });
      set('.punch-hole-left', { opacity: 0 });
      set('#under-shadow-right', { opacity: 0 });
      set('#under-shadow-left', { opacity: 0 });
      set('.wire-arch-path', { stroke: 'url(#wireCylinder)' });

      const tl = createTimeline({
        loop: true,
        defaults: { ease: 'inOutCubic' }
      });

      // 1. REPOSO INICIAL CERRADO (0ms - 450ms)
      // Cuaderno cerrado con logo y base turquesa brillante
      tl.add('#teal-base', {
        opacity: [0.85, 1],
        boxShadow: [
          '0 0 18px rgba(20, 184, 166, 0.35)',
          '0 0 28px rgba(20, 184, 166, 0.6)'
        ],
        duration: 450,
        ease: 'outQuad'
      }, 0);

      // 2. LA PORTADA PASA PRIMERO Y 100% SOLA (450ms - 1250ms)
      // Resuelve Detalle 1: Cero hojas aparecen a la izquierda ni debajo de la portada
      tl.add('#front-cover', {
        rotateY: [0, -180],
        translateZ: [
          { value: 18, duration: 400, ease: 'outQuad' },
          { value: -8, duration: 400, ease: 'inQuad' }
        ],
        duration: 800,
        ease: 'inOutCubic'
      }, 450);

      // Reacción de destello metálico de las anillas cilíndricas al abrir la portada
      tl.add('.wire-arch-path', {
        stroke: [
          'url(#wireCylinder)',
          'url(#wireTealGlow)',
          'url(#wireCylinder)'
        ],
        delay: stagger(15),
        duration: 340
      }, 750);

      tl.add('.wire-ring-group', {
        keyframes: [
          { translateY: -0.6, duration: 140, ease: 'outQuad' },
          { translateY: 0, duration: 160, ease: 'inOutQuad' }
        ],
        delay: stagger(12)
      }, 750);

      // Los orificios troquelados del lado izquierdo se revelan al pasar la portada
      tl.add('.punch-hole-left', {
        opacity: [0, 1],
        duration: 320,
        ease: 'outQuad'
      }, 850);

      // 3. HOJAS INTERIORES EN CASCADA (1450ms - 2850ms)
      // Inician con holgura SOLO DESPUÉS de que la portada ya esté 100% abierta en la izquierda
      function addPageCascade(leafId, bodyId, shadowId, landingZ, startTime) {
        // Giro completo de 0° a -180° que acompaña a la portada hasta el otro lado
        tl.add(leafId, {
          rotateY: [0, -180],
          translateZ: [
            { value: 14, duration: 350, ease: 'outQuad' },
            { value: landingZ, duration: 350, ease: 'inQuad' }
          ],
          duration: 700,
          ease: 'inOutCubic'
        }, startTime);

        // Flexión cilíndrica elástica natural del papel
        tl.add(bodyId, {
          keyframes: [
            { rotateY: 18, rotateZ: -2, duration: 290, ease: 'outQuad' },
            { rotateY: -10, rotateZ: 1.5, duration: 260, ease: 'inQuad' },
            { rotateY: 0, rotateZ: 0, duration: 150, ease: 'outQuad' }
          ]
        }, startTime);

        // Sombra dinámica en la cresta de la curvatura
        tl.add(shadowId, {
          keyframes: [
            { opacity: 0, duration: 40 },
            { opacity: 0.5, duration: 280, ease: 'outQuad' },
            { opacity: 0, duration: 340, ease: 'inQuad' }
          ]
        }, startTime);

        // Destello táctil en el alambre de las anillas al cruzar cada hoja
        tl.add('.wire-arch-path', {
          stroke: [
            'url(#wireCylinder)',
            'url(#wireTealGlow)',
            'url(#wireCylinder)'
          ],
          delay: stagger(12),
          duration: 200
        }, startTime + 220);

        tl.add('.wire-ring-group', {
          keyframes: [
            { translateY: -0.5, duration: 110, ease: 'outQuad' },
            { translateY: 0, duration: 130, ease: 'outQuad' }
          ],
          delay: stagger(12)
        }, startTime + 220);
      }

      // Cascada de hojas: Hoja 1 aterriza sobre la portada (-5px), luego Hoja 2 (-2px) y Hoja 3 (+1px)
      addPageCascade('#leaf-1', '#leaf-body-1', '#curl-shadow-1', -5, 1450);
      addPageCascade('#leaf-2', '#leaf-body-2', '#curl-shadow-2', -2, 1800);
      addPageCascade('#leaf-3', '#leaf-body-3', '#curl-shadow-3', 1, 2150);

      // Sombras dinámicas sobre el papel de base
      tl.add('#under-shadow-right', {
        keyframes: [
          { opacity: 0.35, duration: 300, ease: 'outQuad' },
          { opacity: 0, duration: 400, ease: 'inQuad' }
        ]
      }, 1500);

      // 4. REPOSO CON TRANSICIÓN COMPLETADA AL 100% (2850ms - 3700ms)
      // La portada (-8px) y las 3 hojas (-5px, -2px, 1px) reposan juntas a la izquierda
      tl.add({}, { duration: 850 });

      // 5. RETORNO ORDENADO: HOJAS VUELVEN PRIMERO A LA DERECHA (3700ms - 4650ms)
      function addPageReturn(leafId, bodyId, finalZ, startTime) {
        tl.add(leafId, {
          rotateY: [-180, 0],
          translateZ: [
            { value: 14, duration: 280, ease: 'outQuad' },
            { value: finalZ, duration: 260, ease: 'inQuad' }
          ],
          duration: 540,
          ease: 'inOutCubic'
        }, startTime);

        tl.add(bodyId, {
          keyframes: [
            { rotateY: -16, rotateZ: 2, duration: 220, ease: 'outQuad' },
            { rotateY: 10, rotateZ: -1, duration: 200, ease: 'inQuad' },
            { rotateY: 0, rotateZ: 0, duration: 120, ease: 'outQuad' }
          ]
        }, startTime);
      }

      // Regresan en orden inverso a la pila derecha
      addPageReturn('#leaf-3', '#leaf-body-3', 2, 3700);
      addPageReturn('#leaf-2', '#leaf-body-2', 4, 3900);
      addPageReturn('#leaf-1', '#leaf-body-1', 6, 4100);

      // Los orificios troquelados izquierdos se ocultan al cerrarse las hojas
      tl.add('.punch-hole-left', {
        opacity: [1, 0],
        duration: 300,
        ease: 'outQuad'
      }, 4300);

      // 6. LA PORTADA CIERRA SOBRE TODAS LAS HOJAS (4750ms - 5450ms)
      // Inicia cuando TODAS las hojas ya están quietas y reposando en Z=2, 4, 6
      tl.add('#front-cover', {
        rotateY: [-180, 0],
        translateZ: [
          { value: 18, duration: 360, ease: 'outQuad' },
          { value: 8, duration: 340, ease: 'inQuad' }
        ],
        duration: 700,
        ease: 'inOutCubic'
      }, 4750);

      // Reacción de los anillos al cierre del cuaderno
      tl.add('.wire-ring-group', {
        keyframes: [
          { translateY: -0.6, duration: 140, ease: 'outQuad' },
          { translateY: 0, duration: 160, ease: 'outQuad' }
        ],
        delay: stagger(15)
      }, 5050);

      tl.add('.wire-arch-path', {
        stroke: [
          'url(#wireCylinder)',
          'url(#wireTealGlow)',
          'url(#wireCylinder)'
        ],
        delay: stagger(15),
        duration: 260
      }, 5050);

      // 7. REPOSO CON LIBRETA CERRADA Y LOGO ILUMINADO (5450ms - 6200ms)
      tl.add('#teal-base', {
        opacity: [1, 0.85],
        boxShadow: [
          '0 0 28px rgba(20, 184, 166, 0.65)',
          '0 0 16px rgba(20, 184, 166, 0.35)'
        ],
        duration: 750,
        ease: 'outQuad'
      }, 5450);

      tl.add({}, { duration: 400 });

      currentTimeline = tl;
    }

    // --- Modo 2: Hojeo Continuo Infinito (Libreta abierta en ángulo isométrico) ---
    function buildInfiniteTimeline() {
      if (currentTimeline) {
        currentTimeline.cancel();
      }

      const { createTimeline, stagger, set } = anime;

      // Estado base: libreta ya abierta
      set('#front-cover', { rotateY: -180, translateZ: -8, opacity: 1 });
      set('.punch-hole-left', { opacity: 1 });
      set(['#leaf-1', '#leaf-2', '#leaf-3'], { rotateY: 0, translateZ: 0, opacity: 1 });
      set(['#leaf-body-1', '#leaf-body-2', '#leaf-body-3'], { rotateY: 0, rotateZ: 0 });
      set(['#curl-shadow-1', '#curl-shadow-2', '#curl-shadow-3'], { opacity: 0 });
      set('.wire-arch-path', { stroke: 'url(#wireCylinder)' });

      const tl = createTimeline({
        loop: true,
        defaults: { ease: 'inOutCubic' }
      });

      function addContinuousFlip(leafId, bodyId, shadowId, landingZ, startTime) {
        tl.add(leafId, {
          rotateY: [0, -180],
          translateZ: [
            { value: 15, duration: 380, ease: 'outQuad' },
            { value: landingZ, duration: 380, ease: 'inQuad' }
          ],
          duration: 760,
          ease: 'inOutCubic'
        }, startTime);

        tl.add(bodyId, {
          keyframes: [
            { rotateY: 18, rotateZ: -2, duration: 320, ease: 'outQuad' },
            { rotateY: -10, rotateZ: 1.5, duration: 280, ease: 'inQuad' },
            { rotateY: 0, rotateZ: 0, duration: 160, ease: 'outQuad' }
          ]
        }, startTime);

        tl.add(shadowId, {
          keyframes: [
            { opacity: 0, duration: 40 },
            { opacity: 0.5, duration: 300, ease: 'outQuad' },
            { opacity: 0, duration: 380, ease: 'inQuad' }
          ]
        }, startTime);

        tl.add('.wire-arch-path', {
          stroke: [
            'url(#wireCylinder)',
            'url(#wireTealGlow)',
            'url(#wireCylinder)'
          ],
          delay: stagger(12),
          duration: 180
        }, startTime + 220);

        tl.add('.wire-ring-group', {
          keyframes: [
            { translateY: -0.5, duration: 110, ease: 'outQuad' },
            { translateY: 0, duration: 140, ease: 'outQuad' }
          ],
          delay: stagger(12)
        }, startTime + 220);

        // Ocultar y recolocar silenciosamente detrás de la pila derecha para reiniciar ciclo
        tl.add(leafId, {
          opacity: [1, 0],
          duration: 80
        }, startTime + 1100);

        tl.add(leafId, {
          rotateY: 0,
          translateZ: 0,
          duration: 10
        }, startTime + 1200);

        tl.add(leafId, {
          opacity: [0, 1],
          duration: 100
        }, startTime + 1220);
      }

      addContinuousFlip('#leaf-1', '#leaf-body-1', '#curl-shadow-1', -5, 0);
      addContinuousFlip('#leaf-2', '#leaf-body-2', '#curl-shadow-2', -2, 700);
      addContinuousFlip('#leaf-3', '#leaf-body-3', '#curl-shadow-3', 1, 1400);

      tl.add({}, { duration: 350 });

      currentTimeline = tl;
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof anime === 'undefined') {
        console.warn('Anime.js UMD no disponible');
        return;
      }
      buildCycleTimeline();
    });
  </script>
</body>
</html>
